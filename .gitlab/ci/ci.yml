.ci-main:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|web)$/'

.python-tools:
  image:
    name: "$PLATFORM_TOOLS_IMAGE"
    pull_policy: if-not-present

verify:
  extends: .python-tools
  image:
    name: "$PLATFORM_VERIFY_IMAGE"
    pull_policy: if-not-present
  stage: verify
  timeout: 30m
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    CARGO_HOME: /ci-cache/platform/rust-1.94.1/cargo
    CARGO_TARGET_DIR: /ci-cache/platform/rust-1.94.1/target
    PLATFORM_CACHE_MOUNT: /ci-cache
  cache: []
  resource_group: platform-verify-cache
  script:
    - bash script/verify_ci.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths: [package/logs/]

metadata:
  extends: [.python-tools, .ci-main]
  stage: verify
  timeout: 10m
  script:
    - python3 -B script/gitlab_ci.py metadata
  artifacts:
    expire_in: 14 days
    paths: [package/metadata.json, package/build.env]
    reports:
      dotenv: package/build.env

build-image:
  extends: .ci-main
  stage: build
  image:
    name: "$PLATFORM_BUILDKIT_IMAGE"
    entrypoint: [""]
  timeout: 45m
  variables:
    GIT_SUBMODULE_STRATEGY: normal
  needs:
    - job: verify
      artifacts: false
    - job: metadata
      artifacts: true
  resource_group: platform-ci-image-build
  environment:
    name: ci-build
    action: prepare
  script:
    - |
      set -eu
      umask 077
      mkdir -p .buildkit-tls
      printf '%s' "$BUILDKIT_CA_B64" | base64 -d > .buildkit-tls/ca.pem
      printf '%s' "$BUILDKIT_CERT_B64" | base64 -d > .buildkit-tls/client.pem
      printf '%s' "$BUILDKIT_KEY_B64" | base64 -d > .buildkit-tls/client-key.pem
      buildctl --addr "$BUILDKIT_HOST" \
        --tlscacert .buildkit-tls/ca.pem --tlscert .buildkit-tls/client.pem --tlskey .buildkit-tls/client-key.pem \
        build --frontend dockerfile.v0 --local context=. --local dockerfile=. \
        --opt platform=linux/amd64 \
        --opt "build-arg:RUST_IMAGE=$PLATFORM_RUST_IMAGE" \
        --opt "build-arg:RUNTIME_IMAGE=$PLATFORM_RUNTIME_IMAGE" \
        --opt "build-arg:VERSION=$PLATFORM_VERSION" --opt build-arg:CHANNEL=ci \
        --opt "build-arg:COMMIT=$PLATFORM_COMMIT" --opt "build-arg:BUILD_TIME=$PLATFORM_BUILD_TIME" \
        --opt "build-arg:SOURCE=$CI_PROJECT_URL" \
        --output "type=docker,name=$PLATFORM_IMAGE,dest=package/image.tar"
  after_script:
    - rm -f .buildkit-tls/ca.pem .buildkit-tls/client.pem .buildkit-tls/client-key.pem
    - rmdir .buildkit-tls 2>/dev/null || true
  artifacts:
    expire_in: 14 days
    paths: [package/image.tar]

package:
  extends: [.python-tools, .ci-main]
  stage: package
  timeout: 20m
  needs: [metadata, build-image]
  script:
    - python3 -B script/gitlab_package.py prepare-platform --metadata package/metadata.json --image-tar package/image.tar
  artifacts:
    expire_in: 14 days
    paths: [package/metadata.json, package/binary.tar.gz, package/image.tar.gz, package/upload-metadata.json, package/image-identity.json]

offline-bundle:
  extends: [.python-tools, .ci-main]
  stage: publish
  timeout: 20m
  needs: [package]
  when: manual
  allow_failure: true
  script:
    - python3 -B script/gitlab_package.py offline-platform --metadata package/metadata.json
  artifacts:
    expire_in: 14 days
    paths: [release/]

upload-platform:
  extends: [.python-tools, .ci-main]
  stage: publish
  timeout: 20m
  interruptible: false
  needs: [package]
  resource_group: platform-ci-upload
  environment:
    name: ci
  variables:
    GIT_SUBMODULE_STRATEGY: normal
  script:
    - python3 -B script/init_platform_proto.py
    - python3 -B script/gitlab_ci.py publish-head-check --metadata package/metadata.json
    - python3 -B script/upload_platform.py --metadata package/metadata.json --archive package/binary.tar.gz
