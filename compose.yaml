services:
  platform:
    image: ${MSKDSP_PLATFORM_IMAGE:-ghcr.io/ccoolcyy/mskdsp-platform:ci}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${MSKDSP_PLATFORM_VERSION:-0.0.1}
        CHANNEL: ${MSKDSP_PLATFORM_CHANNEL:-dev}
        COMMIT: ${MSKDSP_PLATFORM_COMMIT:-unknown}
        BUILD_TIME: ${MSKDSP_PLATFORM_BUILD_TIME:-}
        SOURCE: ${MSKDSP_PLATFORM_SOURCE:-}
        UPDATE_MANIFEST_URL: ${MSKDSP_PLATFORM_UPDATE_URL:-https://update.clsclear.top/mskdsp-platform/ci/latest.json}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      MSKDSP_PLATFORM_CONFIG: /app/config.toml
      MSKDSP_RUNTIME_DIR: /var/lib/mskdsp-platform
      MSKDSP_PLATFORM_DATA_DIR: /var/lib/mskdsp-platform/data
      TMPDIR: /var/lib/mskdsp-platform/tmp
    working_dir: /var/lib/mskdsp-platform
    volumes:
      - ${MSKDSP_WORK_DIR:-/home/daniel/mskplt}/deploy/config.toml:/app/config.toml:ro
      - ${MSKDSP_WORK_DIR:-/home/daniel/mskplt}/deploy/updater.json:/app/updater.json:ro
      - ${MSKDSP_WORK_DIR:-/home/daniel/mskplt}/runtime:/var/lib/mskdsp-platform
      - ${MSKDSP_WORK_DIR:-/home/daniel/mskplt}/runtime/tmp:/tmp
    ports:
      - "${MSKDSP_BIND_ADDRESS:-127.0.0.1}:${MSKDSP_HTTP_PORT:-8080}:8080"
      - "${MSKDSP_BIND_ADDRESS:-127.0.0.1}:${MSKDSP_GRPC_PORT:-50000}:50000"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
