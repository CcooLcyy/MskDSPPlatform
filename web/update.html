<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script id="theme-script">
// 在首屏绘制前恢复主题，所有页面使用同一份偏好。
(() => {
  const key = 'mskdsp-platform-theme';
  const valid = value => ['system', 'light', 'dark'].includes(value);
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  try {
    const saved = window.localStorage.getItem(key);
    if (valid(saved)) preference = saved;
  } catch { /* 存储受限时仍可在当前页面切换主题。 */ }
  function apply() {
    document.documentElement.dataset.theme = preference === 'system' ? (system.matches ? 'dark' : 'light') : preference;
    const select = document.getElementById('theme-select');
    if (select) select.value = preference;
  }
  apply();
  system.addEventListener('change', apply);
  window.addEventListener('storage', event => {
    if (event.key !== key && event.key !== null) return;
    preference = valid(event.newValue) ? event.newValue : 'system';
    apply();
  });
  document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('theme-select');
    apply();
    select.addEventListener('change', () => {
      preference = valid(select.value) ? select.value : 'system';
      try { window.localStorage.setItem(key, preference); }
      catch { /* 保存失败不影响当前页面的显示。 */ }
      apply();
    });
  });
})();
  </script>
  <title>MskDSPPlatform · 程序更新</title>
  <link rel="stylesheet" href="/assets/platform.css">
  <style>
    .update-content { max-width: 1250px; }
    .version-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-bottom: 24px; }
    .version-panel { display: flex; flex-direction: column; padding: 26px; }
    .version-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    .running-badge { color: var(--success); background: var(--success-bg); }
    .version-label { color: var(--muted); font-size: 12px; }
    .version-code { margin: 5px 0 12px; font-size: 28px; font-weight: 700; line-height: 1.4; letter-spacing: -.02em; overflow-wrap: anywhere; }
    .version-panel .hint { min-height: 42px; margin: 0 0 24px; }
    .version-panel .actions { margin-top: auto; padding-top: 22px; border-top: 1px solid var(--border); }
    .channel-caption { color: var(--muted); font-size: 12px; }
    .channel-caption strong { color: var(--text); font-weight: 550; }
    .task-status { margin-bottom: 22px; }
    .task-status .panel-heading { border-bottom: 0; padding-bottom: 0; }
    .task-indicator { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 7px; background: var(--subtle); color: var(--muted); font-size: 12px; }
    .task-indicator::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .task-indicator.error { color: var(--danger); background: var(--danger-bg); }
    .task-indicator.success { color: var(--success); background: var(--success-bg); }
    .task-indicator.processing { color: var(--link); background: var(--notice); }
    #message { margin: 0; min-height: 24px; overflow-wrap: anywhere; }
    #message.error { color: var(--danger); }
    #connection { margin: 12px 0 0; padding: 10px 13px; border: 1px solid var(--danger-border); border-radius: 8px; background: var(--danger-bg); color: var(--danger); font-size: 12px; }
    .update-footer { max-width: 820px; }
    @media (max-width: 900px) { .version-panel { padding: 22px; } .version-grid { gap: 16px; } .version-code { font-size: 24px; } }
    @media (max-width: 650px) { .version-grid { grid-template-columns: 1fr; } .version-panel { padding: 22px; } .version-heading { margin-bottom: 16px; } .version-panel .hint { min-height: 0; margin-bottom: 18px; } .version-panel .actions { padding-top: 18px; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar" aria-label="平台导航">
      <div class="app-brand"><span class="brand-mark" aria-hidden="true">M</span><span><span class="brand-name">MskDSP</span><span class="brand-caption">远程服务平台</span></span></div>
      <p class="nav-label">工作台</p>
      <nav class="app-nav" aria-label="平台功能">
        <a class="nav-item" href="/modbus-templates"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 9v11"/></svg></span>点表库</a>
        <a class="nav-item" href="/modbus-templates#trash"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg></span>回收站</a>
        <a class="nav-item" href="/update" aria-current="page"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 15V4m-4 4 4-4 4 4M5 14v6h14v-6"/></svg></span>程序更新</a>
      </nav>
      <div class="sidebar-footer">MskDSPPlatform<br>点表与更新管理</div>
    </aside>
    <div class="app-content">
      <header class="app-topbar">
        <span class="topbar-label">平台管理 / 程序更新</span>
        <div class="account-actions"><label class="theme-control" for="theme-select">外观<select id="theme-select" aria-label="页面主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><span id="username">正在确认</span><button id="logout" class="quiet" type="button" disabled>退出登录</button></div>
      </header>
      <main class="page-content update-content">
        <div class="page-heading"><div><span class="eyebrow">平台维护</span><h1>程序更新</h1><p class="page-summary">查看当前版本，手动检查并安装可用更新。</p></div></div>
        <div class="version-grid">
          <section class="version-panel panel" aria-labelledby="current-heading">
            <div class="version-heading"><h2 id="current-heading">当前版本</h2><span class="badge running-badge">正在运行</span></div>
            <span class="version-label">平台版本</span><div id="current" class="version-code">—</div>
            <p class="hint">当前平台运行的程序版本。</p>
            <div class="actions"><span class="channel-caption">更新通道 · <strong id="channel">—</strong></span></div>
          </section>
          <section class="version-panel panel" aria-labelledby="available-heading">
            <div class="version-heading"><h2 id="available-heading">可用版本</h2><span class="badge">手动更新</span></div>
            <span class="version-label">最新检查结果</span><div id="latest" class="version-code">待检查</div>
            <p class="hint">先检查可用更新，再选择是否安装。</p>
            <div class="actions"><button id="check" type="button" disabled>检查更新</button><button id="apply" class="primary" type="button" disabled>安装更新</button></div>
          </section>
        </div>
        <section id="task-status" class="task-status panel" aria-labelledby="task-heading">
          <div class="panel-heading"><h2 id="task-heading">任务状态</h2><span id="state" class="task-indicator">正在读取</span></div>
          <div class="panel-body" role="status" aria-live="polite"><p id="message">正在读取更新状态…</p><p id="connection" hidden></p></div>
        </section>
        <footer class="update-footer">更新由你手动发起。安装期间服务会短暂重连，更新失败时将尝试恢复上一版本。更新成功后若会话失效，请重新登录。</footer>
        <noscript>请启用 JavaScript 以查看更新状态并操作更新。</noscript>
      </main>
    </div>
  </div>
  <script type="module">
const labels = {idle:'待检查', checking:'检查中', available:'有新版本', current:'已是最新版', updating:'更新中', succeeded:'更新成功', error:'更新失败'};
const channels = {ci:'测试通道', beta:'预发布通道', stable:'稳定通道', dev:'开发版本'};
const text = value => typeof value === 'string' ? value : '';
const busy = status => status?.state === 'checking' || status?.state === 'updating';
const validStatus = value => value && typeof value === 'object' && typeof value.enabled === 'boolean' && Object.hasOwn(labels, value.state);
const validUser = value => typeof value?.username === 'string' && Boolean(value.username.trim()) && value?.role === 'admin';

function getView(status, flags = {}) {
  const processing = flags.pending || flags.refreshing || flags.loggingOut || busy(status);
  const disabled = !status?.enabled || processing || flags.disconnected || flags.unauthorized;
  return {
    checkDisabled: Boolean(disabled),
    applyDisabled: Boolean(disabled || status?.update_available !== true),
    processing: Boolean(processing),
  };
}

function createUpdateClient({fetchImpl, onChange, reload, onUnauthorized = () => {}}) {
  let status = null, pending = false, disconnected = false, refreshing = false, actionError = '';
  let username = '', loggingOut = false, stopped = false;
  let watching = null, reloaded = false;
  const snapshot = () => ({status, username, pending, refreshing, loggingOut, stopped, disconnected, actionError, view:getView(status, {pending, refreshing, loggingOut, disconnected, unauthorized:stopped || !username})});
  const notify = () => onChange(snapshot());
  function requireLogin() {
    if (stopped) return;
    stopped = true; status = null; username = ''; watching = null;
    notify();
    onUnauthorized();
  }
  async function request(url, method = 'GET', kind = 'update') {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 10000);
    try {
      const options = {method, cache:'no-store', credentials:'same-origin', signal:controller.signal};
      if (method === 'POST') {
        options.headers = {'Content-Type':'application/json', 'X-MskDSP-Action':kind === 'update' ? 'update' : 'auth'};
        options.body = '{}';
      }
      const response = await fetchImpl(url, options);
      if (response.status === 401) requireLogin();
      if (kind === 'logout' && response.status === 204) return null;
      const body = await response.json().catch(() => null);
      if (!response.ok) {
        const error = new Error(text(body?.error) || `请求失败（HTTP ${response.status}）`);
        error.httpStatus = response.status;
        throw error;
      }
      if (kind === 'update' ? !validStatus(body) : kind === 'user' ? !validUser(body) : true) {
        const error = new Error(kind === 'update' ? '更新接口返回了无法识别的状态' : '登录接口返回了无法识别的用户信息');
        error.httpStatus = response.status;
        throw error;
      }
      return body;
    } finally { clearTimeout(timer); }
  }
  function failed(error) {
    if (stopped) return;
    disconnected = !error.httpStatus;
    actionError = disconnected ? '' : error.message;
  }
  async function refreshAssets() {
    if (stopped || loggingOut || reloaded || !watching || status?.state !== 'succeeded' || status.job_id !== watching.job || text(status.current_version) === watching.version) return;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);
    try {
      const response = await fetchImpl('/readyz', {method:'GET', cache:'no-store', credentials:'same-origin', signal:controller.signal});
      const body = await response.json();
      if (stopped || loggingOut || !response.ok || body?.status !== 'ready') return;
      reloaded = true;
      reload();
    } catch { /* 服务恢复后，后续状态轮询会再次检查就绪。 */ }
    finally { clearTimeout(timer); }
  }
  return {
    snapshot,
    async refresh() {
      if (stopped || loggingOut || refreshing || pending) return;
      refreshing = true;
      notify();
      try {
        if (!username) {
          const user = await request('/api/v1/auth/me', 'GET', 'user');
          if (stopped) return;
          username = user.username;
        }
        const result = await request('/api/update/status');
        if (stopped) return;
        status = result;
        disconnected = false; actionError = '';
        notify();
        await refreshAssets();
      } catch (error) { failed(error); }
      finally { refreshing = false; notify(); }
    },
    async action(operation) {
      const view = snapshot().view;
      if (refreshing || !['check','apply'].includes(operation) || (operation === 'check' ? view.checkDisabled : view.applyDisabled)) return;
      pending = true; actionError = '';
      const version = text(status?.current_version);
      watching = null;
      notify();
      try {
        const result = await request(`/api/update/${operation}`, 'POST');
        if (stopped) return;
        status = result;
        disconnected = false;
        if (operation === 'apply' && text(status.job_id) && ['updating','succeeded'].includes(status.state)) watching = {job:status.job_id, version};
        await refreshAssets();
      } catch (error) { failed(error); }
      finally { pending = false; notify(); }
    },
    async logout() {
      if (stopped || loggingOut || !username) return;
      loggingOut = true; actionError = '';
      notify();
      try {
        await request('/api/v1/auth/logout', 'POST', 'logout');
        requireLogin();
      } catch (error) {
        if (!stopped) actionError = error.httpStatus ? error.message : '退出失败，暂时无法连接平台，请重试';
      } finally { loggingOut = false; notify(); }
    },
  };
}

// 页面启动
const element = id => document.getElementById(id);
let timer;
const client = createUpdateClient({
  fetchImpl:window.fetch.bind(window),
  reload:() => window.location.reload(),
  onUnauthorized:() => { clearTimeout(timer); window.location.replace('/login'); },
  onChange:({status, username, pending, loggingOut, stopped, disconnected, actionError, view}) => {
    element('username').textContent = username || (stopped ? '未登录' : '正在确认');
    element('logout').disabled = !username || loggingOut || stopped;
    element('logout').textContent = loggingOut ? '正在退出…' : '退出登录';
    element('current').textContent = text(status?.current_version) || '—';
    element('latest').textContent = text(status?.latest_version) || '待检查';
    element('channel').textContent = channels[status?.channel] || text(status?.channel) || '—';
    element('state').textContent = disconnected ? '连接中断' : pending ? '正在提交' : labels[status?.state] || '正在读取';
    element('message').textContent = actionError || text(status?.message) || (status?.enabled === false ? '网页更新未启用，请由管理员配置更新源。' : '点击“检查更新”获取最新版本。');
    element('connection').hidden = !disconnected;
    element('connection').textContent = disconnected ? '暂时无法连接，正在自动重试读取状态。' : '';
    element('check').disabled = view.checkDisabled;
    element('apply').disabled = view.applyDisabled;
    element('task-status').setAttribute('aria-busy', String(view.processing));
    element('state').classList.toggle('error', Boolean(actionError || status?.state === 'error' || disconnected));
    element('state').classList.toggle('success', status?.state === 'succeeded' || status?.state === 'current');
    element('state').classList.toggle('processing', busy(status) || pending);
    element('message').classList.toggle('error', Boolean(actionError || status?.state === 'error'));
  },
});
async function poll() {
  clearTimeout(timer);
  await client.refresh();
  if (!client.snapshot().stopped) timer = setTimeout(poll, busy(client.snapshot().status) ? 2000 : 5000);
}
for (const operation of ['check','apply']) {
  element(operation).addEventListener('click', async () => {
    clearTimeout(timer);
    await client.action(operation);
    poll();
  });
}
window.addEventListener('online', poll);
element('logout').addEventListener('click', async () => {
  clearTimeout(timer);
  await client.logout();
  if (!client.snapshot().stopped) poll();
});
poll();
  </script>
</body>
</html>
