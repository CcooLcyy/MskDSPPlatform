<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script id="theme-script">
// 在首屏绘制前恢复主题，所有页面使用同一份偏好。
(() => {
  const key = 'mskdsp-platform-theme';
  const valid = value => ['system', 'light', 'dark'].includes(value);
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  try {
    const saved = window.localStorage.getItem(key);
    if (valid(saved)) preference = saved;
  } catch { /* 存储受限时仍可在当前页面切换主题。 */ }
  function apply() {
    document.documentElement.dataset.theme = preference === 'system' ? (system.matches ? 'dark' : 'light') : preference;
    const select = document.getElementById('theme-select');
    if (select) select.value = preference;
  }
  apply();
  system.addEventListener('change', apply);
  window.addEventListener('storage', event => {
    if (event.key !== key && event.key !== null) return;
    preference = valid(event.newValue) ? event.newValue : 'system';
    apply();
  });
  document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('theme-select');
    apply();
    select.addEventListener('change', () => {
      preference = valid(select.value) ? select.value : 'system';
      try { window.localStorage.setItem(key, preference); }
      catch { /* 保存失败不影响当前页面的显示。 */ }
      apply();
    });
  });
})();
  </script>
  <title>MskDSPPlatform · 程序更新</title>
  <style>
    /* 三个页面共用语义色，系统主题在脚本不可用时仍然生效。 */
    :root { color-scheme: light;
      --page: #f3f5f8; --text: #172638; --muted: #516277;
      --surface: #ffffff; --subtle: #f4f7fb; --border: #dce3eb; --control-border: #c6d0de;
      --selected: #e9f0ff; --selected-border: #6090ee; --link: #2455bc;
      --notice: #eef3fa; --danger: #a52c34; --danger-bg: #fff1f2; --danger-border: #f2cbd0;
      --warning: #9b4b1b; --focus: #8bb5ff; --sticky: #fffffff2; --shadow: #17304b0d; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark;
      --page: #0f1723; --text: #e5edf7; --muted: #a6b5c8;
      --surface: #182334; --subtle: #121d2c; --border: #35465d; --control-border: #536780;
      --selected: #233b60; --selected-border: #78a7ff; --link: #9fc1ff;
      --notice: #1b304a; --danger: #ffadb7; --danger-bg: #3c202d; --danger-border: #98505d;
      --warning: #ffc18d; --focus: #8bb5ff; --sticky: #182334f2; --shadow: #00000033; }
    }
    :root[data-theme="dark"] { color-scheme: dark;
      --page: #0f1723; --text: #e5edf7; --muted: #a6b5c8;
      --surface: #182334; --subtle: #121d2c; --border: #35465d; --control-border: #536780;
      --selected: #233b60; --selected-border: #78a7ff; --link: #9fc1ff;
      --notice: #1b304a; --danger: #ffadb7; --danger-bg: #3c202d; --danger-border: #98505d;
      --warning: #ffc18d; --focus: #8bb5ff; --sticky: #182334f2; --shadow: #00000033; }
    a { color: var(--link); }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
    input[type="checkbox"] { accent-color: #2563eb; }
    .theme-control { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .theme-control select { width: auto; margin: 0; border: 1px solid var(--control-border); border-radius: 8px; padding: 6px 10px; background: var(--surface); color: var(--text); font: inherit; }
    .theme-control select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 64px auto; }
    .brand { color: var(--muted); font-size: 13px; letter-spacing: .05em; margin-bottom: 10px; }
    .account { display: flex; align-items: center; justify-content: flex-end; gap: 12px; color: var(--muted); margin-bottom: 20px; }
    .account button { padding: 6px 12px; }
    h1 { font-size: 28px; line-height: 1.3; margin: 0 0 10px; }
    .intro { color: var(--muted); margin: 0 0 28px; }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 8px 30px var(--shadow); }
    dl { margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 18px 22px; }
    dt { color: var(--muted); }
    dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .version { font-weight: 650; }
    .result { margin-top: 25px; background: var(--subtle); border-radius: 10px; padding: 16px; min-height: 70px; }
    .result strong { font-size: 13px; color: var(--muted); font-weight: 500; }
    #message { margin: 4px 0 0; overflow-wrap: anywhere; }
    #connection { margin: 8px 0 0; font-size: 13px; color: var(--warning); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    button { border: 1px solid var(--control-border); border-radius: 9px; background: var(--surface); color: var(--text); font: inherit; font-weight: 600; padding: 10px 20px; cursor: pointer; }
    button.primary { background: #2563eb; color: white; border-color: #2563eb; }
    button:hover:not(:disabled) { filter: brightness(.95); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    footer { color: var(--muted); font-size: 13px; margin-top: 18px; }
    @media (max-width: 520px) { main { margin: 30px auto; } section { padding: 22px 18px; } dl { grid-template-columns: 80px 1fr; gap: 16px; } h1 { font-size: 25px; } .actions button { flex: 1; padding: 10px 12px; } }
  </style>
</head>
<body>
  <main>
    <label class="theme-control" for="theme-select">外观<select id="theme-select" aria-label="页面主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
    <div class="brand">MskDSPPlatform</div>
    <nav aria-label="平台功能"><a href="/modbus-templates">Modbus 点表库</a> · <a href="/update" aria-current="page">程序更新</a></nav>
    <div class="account"><span>管理员：<span id="username">正在确认</span></span><button id="logout" type="button" disabled>退出登录</button></div>
    <h1>程序更新</h1>
    <p class="intro">查看平台版本，手动检查并安装最新更新。</p>
    <section aria-label="平台更新信息">
      <dl>
        <dt>当前版本</dt><dd id="current" class="version">—</dd>
        <dt>最新版本</dt><dd id="latest" class="version">待检查</dd>
        <dt>更新通道</dt><dd id="channel">—</dd>
        <dt>更新来源</dt><dd id="source">—</dd>
        <dt>更新状态</dt><dd id="state">正在读取</dd>
      </dl>
      <div class="result" role="status" aria-live="polite">
        <strong>操作结果</strong>
        <p id="message">正在读取更新状态…</p>
        <p id="connection" hidden></p>
      </div>
      <div class="actions">
        <button id="check" type="button" disabled>检查更新</button>
        <button id="apply" class="primary" type="button" disabled>更新到最新版</button>
      </div>
    </section>
    <footer>更新由你手动发起。安装期间服务会短暂重连，更新失败时将尝试恢复上一版本。</footer>
    <noscript>请启用 JavaScript 以查看更新状态并操作更新。</noscript>
  </main>
  <script type="module">
const labels = {idle:'待检查', checking:'检查中', available:'有新版本', current:'已是最新版', updating:'更新中', succeeded:'更新成功', error:'更新失败'};
const channels = {ci:'测试通道', beta:'预发布通道', stable:'稳定通道', dev:'开发版本'};
const text = value => typeof value === 'string' ? value : '';
const busy = status => status?.state === 'checking' || status?.state === 'updating';
const validStatus = value => value && typeof value === 'object' && typeof value.enabled === 'boolean' && Object.hasOwn(labels, value.state);
const validUser = value => typeof value?.username === 'string' && Boolean(value.username.trim()) && value?.role === 'admin';

function getView(status, flags = {}) {
  const processing = flags.pending || flags.refreshing || flags.loggingOut || busy(status);
  const disabled = !status?.enabled || processing || flags.disconnected || flags.unauthorized;
  return {
    checkDisabled: Boolean(disabled),
    applyDisabled: Boolean(disabled || status?.update_available !== true),
    processing: Boolean(processing),
  };
}

function createUpdateClient({fetchImpl, onChange, reload, onUnauthorized = () => {}}) {
  let status = null, pending = false, disconnected = false, refreshing = false, actionError = '';
  let username = '', loggingOut = false, stopped = false;
  let watching = null, reloaded = false;
  const snapshot = () => ({status, username, pending, refreshing, loggingOut, stopped, disconnected, actionError, view:getView(status, {pending, refreshing, loggingOut, disconnected, unauthorized:stopped || !username})});
  const notify = () => onChange(snapshot());
  function requireLogin() {
    if (stopped) return;
    stopped = true; status = null; username = ''; watching = null;
    notify();
    onUnauthorized();
  }
  async function request(url, method = 'GET', kind = 'update') {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 10000);
    try {
      const options = {method, cache:'no-store', credentials:'same-origin', signal:controller.signal};
      if (method === 'POST') {
        options.headers = {'Content-Type':'application/json', 'X-MskDSP-Action':kind === 'update' ? 'update' : 'auth'};
        options.body = '{}';
      }
      const response = await fetchImpl(url, options);
      if (response.status === 401) requireLogin();
      if (kind === 'logout' && response.status === 204) return null;
      const body = await response.json().catch(() => null);
      if (!response.ok) {
        const error = new Error(text(body?.error) || `请求失败（HTTP ${response.status}）`);
        error.httpStatus = response.status;
        throw error;
      }
      if (kind === 'update' ? !validStatus(body) : kind === 'user' ? !validUser(body) : true) {
        const error = new Error(kind === 'update' ? '更新接口返回了无法识别的状态' : '登录接口返回了无法识别的用户信息');
        error.httpStatus = response.status;
        throw error;
      }
      return body;
    } finally { clearTimeout(timer); }
  }
  function failed(error) {
    if (stopped) return;
    disconnected = !error.httpStatus;
    actionError = disconnected ? '' : error.message;
  }
  async function refreshAssets() {
    if (stopped || loggingOut || reloaded || !watching || status?.state !== 'succeeded' || status.job_id !== watching.job || text(status.current_version) === watching.version) return;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);
    try {
      const response = await fetchImpl('/readyz', {method:'GET', cache:'no-store', credentials:'same-origin', signal:controller.signal});
      const body = await response.json();
      if (stopped || loggingOut || !response.ok || body?.status !== 'ready') return;
      reloaded = true;
      reload();
    } catch { /* 服务恢复后，后续状态轮询会再次检查就绪。 */ }
    finally { clearTimeout(timer); }
  }
  return {
    snapshot,
    async refresh() {
      if (stopped || loggingOut || refreshing || pending) return;
      refreshing = true;
      notify();
      try {
        if (!username) {
          const user = await request('/api/v1/auth/me', 'GET', 'user');
          if (stopped) return;
          username = user.username;
        }
        const result = await request('/api/update/status');
        if (stopped) return;
        status = result;
        disconnected = false; actionError = '';
        notify();
        await refreshAssets();
      } catch (error) { failed(error); }
      finally { refreshing = false; notify(); }
    },
    async action(operation) {
      const view = snapshot().view;
      if (refreshing || !['check','apply'].includes(operation) || (operation === 'check' ? view.checkDisabled : view.applyDisabled)) return;
      pending = true; actionError = '';
      const version = text(status?.current_version);
      watching = null;
      notify();
      try {
        const result = await request(`/api/update/${operation}`, 'POST');
        if (stopped) return;
        status = result;
        disconnected = false;
        if (operation === 'apply' && text(status.job_id) && ['updating','succeeded'].includes(status.state)) watching = {job:status.job_id, version};
        await refreshAssets();
      } catch (error) { failed(error); }
      finally { pending = false; notify(); }
    },
    async logout() {
      if (stopped || loggingOut || !username) return;
      loggingOut = true; actionError = '';
      notify();
      try {
        await request('/api/v1/auth/logout', 'POST', 'logout');
        requireLogin();
      } catch (error) {
        if (!stopped) actionError = error.httpStatus ? error.message : '退出失败，暂时无法连接平台，请重试';
      } finally { loggingOut = false; notify(); }
    },
  };
}

// 页面启动
const element = id => document.getElementById(id);
let timer;
const client = createUpdateClient({
  fetchImpl:window.fetch.bind(window),
  reload:() => window.location.reload(),
  onUnauthorized:() => { clearTimeout(timer); window.location.replace('/login'); },
  onChange:({status, username, pending, loggingOut, stopped, disconnected, actionError, view}) => {
    element('username').textContent = username || (stopped ? '未登录' : '正在确认');
    element('logout').disabled = !username || loggingOut || stopped;
    element('logout').textContent = loggingOut ? '正在退出…' : '退出登录';
    element('current').textContent = text(status?.current_version) || '—';
    element('latest').textContent = text(status?.latest_version) || '待检查';
    element('channel').textContent = channels[status?.channel] || text(status?.channel) || '—';
    element('source').textContent = text(status?.source_url) || '未配置';
    element('state').textContent = disconnected ? '连接中断' : pending ? '正在提交' : labels[status?.state] || '正在读取';
    element('message').textContent = actionError || text(status?.message) || (status?.enabled === false ? '网页更新未启用，请由管理员配置更新源。' : '点击“检查更新”获取最新版本。');
    element('connection').hidden = !disconnected;
    element('connection').textContent = disconnected ? '暂时无法连接，正在自动重试读取状态。' : '';
    element('check').disabled = view.checkDisabled;
    element('apply').disabled = view.applyDisabled;
    document.querySelector('section').setAttribute('aria-busy', String(view.processing));
  },
});
async function poll() {
  clearTimeout(timer);
  await client.refresh();
  if (!client.snapshot().stopped) timer = setTimeout(poll, busy(client.snapshot().status) ? 2000 : 5000);
}
for (const operation of ['check','apply']) {
  element(operation).addEventListener('click', async () => {
    clearTimeout(timer);
    await client.action(operation);
    poll();
  });
}
window.addEventListener('online', poll);
element('logout').addEventListener('click', async () => {
  clearTimeout(timer);
  await client.logout();
  if (!client.snapshot().stopped) poll();
});
poll();
  </script>
</body>
</html>
