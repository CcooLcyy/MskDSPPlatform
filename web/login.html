<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script id="theme-script">
// 在首屏绘制前恢复主题，所有页面使用同一份偏好。
(() => {
  const key = 'mskdsp-platform-theme';
  const valid = value => ['system', 'light', 'dark'].includes(value);
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  try {
    const saved = window.localStorage.getItem(key);
    if (valid(saved)) preference = saved;
  } catch { /* 存储受限时仍可在当前页面切换主题。 */ }
  function apply() {
    document.documentElement.dataset.theme = preference === 'system' ? (system.matches ? 'dark' : 'light') : preference;
    const select = document.getElementById('theme-select');
    if (select) select.value = preference;
  }
  apply();
  system.addEventListener('change', apply);
  window.addEventListener('storage', event => {
    if (event.key !== key && event.key !== null) return;
    preference = valid(event.newValue) ? event.newValue : 'system';
    apply();
  });
  document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('theme-select');
    apply();
    select.addEventListener('change', () => {
      preference = valid(select.value) ? select.value : 'system';
      try { window.localStorage.setItem(key, preference); }
      catch { /* 保存失败不影响当前页面的显示。 */ }
      apply();
    });
  });
})();
  </script>
  <title>MskDSPPlatform · 管理员登录</title>
  <style>
    /* 三个页面共用语义色，系统主题在脚本不可用时仍然生效。 */
    :root { color-scheme: light;
      --page: #f3f5f8; --text: #172638; --muted: #516277;
      --surface: #ffffff; --subtle: #f4f7fb; --border: #dce3eb; --control-border: #c6d0de;
      --selected: #e9f0ff; --selected-border: #6090ee; --link: #2455bc;
      --notice: #eef3fa; --danger: #a52c34; --danger-bg: #fff1f2; --danger-border: #f2cbd0;
      --warning: #9b4b1b; --focus: #8bb5ff; --sticky: #fffffff2; --shadow: #17304b0d; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark;
      --page: #0f1723; --text: #e5edf7; --muted: #a6b5c8;
      --surface: #182334; --subtle: #121d2c; --border: #35465d; --control-border: #536780;
      --selected: #233b60; --selected-border: #78a7ff; --link: #9fc1ff;
      --notice: #1b304a; --danger: #ffadb7; --danger-bg: #3c202d; --danger-border: #98505d;
      --warning: #ffc18d; --focus: #8bb5ff; --sticky: #182334f2; --shadow: #00000033; }
    }
    :root[data-theme="dark"] { color-scheme: dark;
      --page: #0f1723; --text: #e5edf7; --muted: #a6b5c8;
      --surface: #182334; --subtle: #121d2c; --border: #35465d; --control-border: #536780;
      --selected: #233b60; --selected-border: #78a7ff; --link: #9fc1ff;
      --notice: #1b304a; --danger: #ffadb7; --danger-bg: #3c202d; --danger-border: #98505d;
      --warning: #ffc18d; --focus: #8bb5ff; --sticky: #182334f2; --shadow: #00000033; }
    a { color: var(--link); }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
    input[type="checkbox"] { accent-color: #2563eb; }
    .theme-control { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .theme-control select { width: auto; margin: 0; border: 1px solid var(--control-border); border-radius: 8px; padding: 6px 10px; background: var(--surface); color: var(--text); font: inherit; }
    .theme-control select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(460px, calc(100% - 32px)); margin: 64px auto; }
    .brand { color: var(--muted); font-size: 13px; letter-spacing: .05em; margin-bottom: 10px; }
    h1 { font-size: 28px; line-height: 1.3; margin: 0 0 10px; }
    .intro { color: var(--muted); margin: 0 0 28px; }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 8px 30px var(--shadow); }
    label { display: block; margin: 0 0 6px; font-weight: 600; }
    input { width: 100%; margin-bottom: 20px; border: 1px solid var(--control-border); border-radius: 9px; padding: 10px 12px; font: inherit; color: inherit; background: var(--surface); }
    button { width: 100%; border: 1px solid #2563eb; border-radius: 9px; padding: 10px 20px; font: inherit; font-weight: 600; color: white; background: #2563eb; cursor: pointer; }
    button:hover:not(:disabled) { filter: brightness(.95); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    #message { margin: 16px 0 0; min-height: 25px; color: var(--warning); overflow-wrap: anywhere; }
    @media (max-width: 520px) { main { margin: 30px auto; } section { padding: 22px 18px; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
  <main>
    <label class="theme-control" for="theme-select">外观<select id="theme-select" aria-label="页面主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
    <div class="brand">MskDSPPlatform</div>
    <h1>管理员登录</h1>
    <p class="intro">登录后可查看平台版本并管理程序更新。</p>
    <section aria-label="管理员登录">
      <form id="login-form" method="post" action="/api/v1/auth/login">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit" type="submit">登录</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <noscript>请启用 JavaScript 以登录管理平台。</noscript>
  </main>
  <script type="module">
function createLoginClient({fetchImpl, onChange, onSuccess}) {
  let pending = false, finished = false, error = '';
  const snapshot = () => ({pending, finished, error});
  const notify = () => onChange(snapshot());
  return {
    snapshot,
    async login(username, password) {
      if (pending || finished) return;
      if (!username.trim() || !password) {
        error = '请输入用户名和密码';
        notify();
        return;
      }
      pending = true; error = '';
      notify();
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetchImpl('/api/v1/auth/login', {
          method:'POST', cache:'no-store', credentials:'same-origin', signal:controller.signal,
          headers:{'Content-Type':'application/json', 'X-MskDSP-Action':'auth'},
          body:JSON.stringify({username:username.trim(), password}),
        });
        const body = await response.json().catch(() => null);
        if (!response.ok) {
          error = typeof body?.error === 'string' ? body.error : response.status === 429 ? '登录尝试过多，请稍后重试' : '登录失败，请重新输入用户名和密码';
          return;
        }
        if (typeof body?.username !== 'string' || !body.username.trim() || body?.role !== 'admin') {
          error = '登录接口返回了无法识别的用户信息';
          return;
        }
        finished = true;
        onSuccess();
      } catch { error = '暂时无法连接平台，请稍后重试'; }
      finally { clearTimeout(timer); pending = false; notify(); }
    },
  };
}

// 页面启动
const element = id => document.getElementById(id);
const client = createLoginClient({
  fetchImpl:window.fetch.bind(window),
  onSuccess:() => window.location.replace('/update'),
  onChange:({pending, finished, error}) => {
    element('submit').disabled = pending || finished;
    element('submit').textContent = pending ? '正在登录…' : finished ? '登录成功' : '登录';
    element('username').disabled = pending || finished;
    element('password').disabled = pending || finished;
    element('message').textContent = error;
    element('login-form').setAttribute('aria-busy', String(pending));
  },
});
element('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  await client.login(element('username').value, element('password').value);
});
  </script>
</body>
</html>
