<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script id="theme-script">
// 在首屏绘制前恢复主题，所有页面使用同一份偏好。
(() => {
  const key = 'mskdsp-platform-theme';
  const valid = value => ['system', 'light', 'dark'].includes(value);
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  try {
    const saved = window.localStorage.getItem(key);
    if (valid(saved)) preference = saved;
  } catch { /* 存储受限时仍可在当前页面切换主题。 */ }
  function apply() {
    document.documentElement.dataset.theme = preference === 'system' ? (system.matches ? 'dark' : 'light') : preference;
    const select = document.getElementById('theme-select');
    if (select) select.value = preference;
  }
  apply();
  system.addEventListener('change', apply);
  window.addEventListener('storage', event => {
    if (event.key !== key && event.key !== null) return;
    preference = valid(event.newValue) ? event.newValue : 'system';
    apply();
  });
  document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('theme-select');
    apply();
    select.addEventListener('change', () => {
      preference = valid(select.value) ? select.value : 'system';
      try { window.localStorage.setItem(key, preference); }
      catch { /* 保存失败不影响当前页面的显示。 */ }
      apply();
    });
  });
})();
  </script>
  <title>MskDSPPlatform · 管理员登录</title>
  <link rel="stylesheet" href="/assets/platform.css">
  <style>
    .login-screen { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: 28px 48px 22px; }
    .login-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .login-wordmark { display: flex; align-items: center; gap: 11px; font-weight: 700; }
    .login-logo { display: grid; place-items: center; width: 35px; height: 35px; border: 1px solid var(--selected-border); border-radius: 10px; color: var(--link); background: var(--notice); }
    .login-logo svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
    .login-wordmark small { display: block; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .06em; }
    .login-layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; align-items: center; gap: 84px; width: min(1050px, 100%); margin: 70px auto; }
    .login-brand h1 { margin: 12px 0 19px; font-size: 40px; line-height: 1.4; letter-spacing: -.035em; }
    .login-brand p { max-width: 420px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.85; }
    .login-capabilities { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .login-capabilities span { padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--muted); font-size: 12px; }
    .login-card { padding: 32px; }
    .login-card h2 { font-size: 23px; }
    .login-card .login-intro { margin: 8px 0 27px; color: var(--muted); font-size: 13px; }
    .login-field { margin-bottom: 20px; }
    .login-card label { margin-bottom: 8px; color: var(--text); font-size: 13px; }
    .login-card input { padding: 11px 12px; }
    .login-card button { width: 100%; margin-top: 4px; padding: 11px 14px; }
    .login-feedback { min-height: 23px; margin: 15px 0 0; color: var(--danger); font-size: 13px; overflow-wrap: anywhere; }
    .login-card .login-footnote { margin: 16px 0 0; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }
    .login-footer { text-align: center; }
    @media (max-width: 1100px) { .login-screen { padding: 24px; } .login-layout { gap: 38px; grid-template-columns: minmax(0, 1fr) 360px; } .login-brand h1 { font-size: 33px; } }
    @media (max-width: 760px) { .login-screen { padding: 20px 18px; } .login-layout { grid-template-columns: 1fr; gap: 25px; max-width: 420px; margin: 40px auto; } .login-brand h1 { font-size: 26px; margin: 8px 0 10px; } .login-brand p { font-size: 13px; } .login-capabilities { display: none; } .login-card { padding: 26px; } }
    @media (max-width: 430px) { .login-wordmark { gap: 8px; font-size: 12px; } .login-wordmark small { font-size: 9px; } .login-header .theme-control { gap: 5px; } .login-header .theme-control select { max-width: 92px; } .login-layout { margin: 32px auto; } }
  </style>
</head>
<body>
  <div class="login-screen">
    <header class="login-header">
      <div class="login-wordmark"><span class="login-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17V7l8 10 8-10v10"/></svg></span><span>MskDSP<small>PLATFORM · 远程服务平台</small></span></div>
      <label class="theme-control" for="theme-select">外观<select id="theme-select" aria-label="页面主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
    </header>
    <main class="login-layout">
      <div class="login-brand">
        <span class="eyebrow">MSKDSP PLATFORM</span>
        <h1>点表与平台更新，<br>在同一个工作台管理。</h1>
        <p>集中维护 Modbus 点表，恢复误删记录，查看版本并管理平台更新。</p>
        <div class="login-capabilities" aria-label="平台功能"><span>Modbus 点表库</span><span>90 天回收站</span><span>程序更新</span></div>
      </div>
      <section class="login-card panel" aria-labelledby="login-heading">
        <h2 id="login-heading">管理员登录</h2>
        <p class="login-intro">使用你的平台管理员账号继续。</p>
        <form id="login-form" method="post" action="/api/v1/auth/login">
          <div class="login-field"><label for="username">用户名</label><input id="username" name="username" type="text" autocomplete="username" aria-describedby="message" placeholder="请输入用户名" required autofocus></div>
          <div class="login-field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="message" placeholder="请输入密码" required></div>
          <button id="submit" class="primary" type="submit">登录</button>
          <p id="message" class="login-feedback" role="status" aria-live="polite"></p>
        </form>
        <p class="login-footnote">请使用已配置的平台账号。登录成功后进入程序更新页面。</p>
        <noscript>请启用 JavaScript 以登录管理平台。</noscript>
      </section>
    </main>
    <footer class="login-footer">MskDSP 远程服务平台</footer>
  </div>
  <script type="module">
function createLoginClient({fetchImpl, onChange, onSuccess}) {
  let pending = false, finished = false, error = '';
  const snapshot = () => ({pending, finished, error});
  const notify = () => onChange(snapshot());
  return {
    snapshot,
    async login(username, password) {
      if (pending || finished) return;
      if (!username.trim() || !password) {
        error = '请输入用户名和密码';
        notify();
        return;
      }
      pending = true; error = '';
      notify();
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetchImpl('/api/v1/auth/login', {
          method:'POST', cache:'no-store', credentials:'same-origin', signal:controller.signal,
          headers:{'Content-Type':'application/json', 'X-MskDSP-Action':'auth'},
          body:JSON.stringify({username:username.trim(), password}),
        });
        const body = await response.json().catch(() => null);
        if (!response.ok) {
          error = typeof body?.error === 'string' ? body.error : response.status === 429 ? '登录尝试过多，请稍后重试' : '登录失败，请重新输入用户名和密码';
          return;
        }
        if (typeof body?.username !== 'string' || !body.username.trim() || body?.role !== 'admin') {
          error = '登录接口返回了无法识别的用户信息';
          return;
        }
        finished = true;
        onSuccess();
      } catch { error = '暂时无法连接平台，请稍后重试'; }
      finally { clearTimeout(timer); pending = false; notify(); }
    },
  };
}

// 页面启动
const element = id => document.getElementById(id);
const client = createLoginClient({
  fetchImpl:window.fetch.bind(window),
  onSuccess:() => window.location.replace('/update'),
  onChange:({pending, finished, error}) => {
    element('submit').disabled = pending || finished;
    element('submit').textContent = pending ? '正在登录…' : finished ? '登录成功' : '登录';
    element('username').disabled = pending || finished;
    element('password').disabled = pending || finished;
    element('message').textContent = error;
    element('login-form').setAttribute('aria-busy', String(pending));
  },
});
element('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  await client.login(element('username').value, element('password').value);
});
  </script>
</body>
</html>
