<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script id="theme-script">
// 在首屏绘制前恢复主题，所有页面使用同一份偏好。
(() => {
  const key = 'mskdsp-platform-theme';
  const valid = value => ['system', 'light', 'dark'].includes(value);
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  try {
    const saved = window.localStorage.getItem(key);
    if (valid(saved)) preference = saved;
  } catch { /* 存储受限时仍可在当前页面切换主题。 */ }
  function apply() {
    document.documentElement.dataset.theme = preference === 'system' ? (system.matches ? 'dark' : 'light') : preference;
    const select = document.getElementById('theme-select');
    if (select) select.value = preference;
  }
  apply();
  system.addEventListener('change', apply);
  window.addEventListener('storage', event => {
    if (event.key !== key && event.key !== null) return;
    preference = valid(event.newValue) ? event.newValue : 'system';
    apply();
  });
  document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('theme-select');
    apply();
    select.addEventListener('change', () => {
      preference = valid(select.value) ? select.value : 'system';
      try { window.localStorage.setItem(key, preference); }
      catch { /* 保存失败不影响当前页面的显示。 */ }
      apply();
    });
  });
})();
  </script><meta name="color-scheme" content="light dark"><style>
#message { overflow-wrap: anywhere; }
#devices { display: flex; flex-wrap: wrap; gap: 8px; }
#credential, #credential-id { font-family: monospace; }
.credential-fields { display: grid; gap: 12px; margin-bottom: 16px; }
.credential-row { display: flex; gap: 8px; margin-top: 7px; }
.credential-row input { flex: 1; }
.credential-row button { flex-shrink: 0; }
#grants > div { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
#grants > div > span { flex: 1; min-width: 180px; }
.panel { margin-bottom: 18px; padding: 18px; }
@media (max-width: 600px) { .panel { padding: 14px; } }
</style><title>MskDSP · 设备管理</title><link rel="stylesheet" href="/assets/platform.css"></head><body><div class="app-shell"><header class="app-topbar"><a class="app-brand" href="/modbus-templates">MskDSP</a><nav class="app-nav" aria-label="平台功能"><a class="nav-item" href="/modbus-templates">点表工作台</a><a class="nav-item" href="/software">软件管理</a><a class="nav-item" href="/accounts">账号管理</a><a class="nav-item" href="/devices" aria-current="page">设备管理</a><a class="nav-item" href="/update">平台维护</a></nav><div class="account-actions"><label class="theme-control" for="theme-select">外观<select id="theme-select" aria-label="页面主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><span id="username"></span><button id="logout" type="button">退出登录</button></div></header><main class="page-content"><div class="page-heading"><div><h1>设备管理</h1><p class="page-summary">管理现场下位机、独立接入凭据和账号访问权限。</p></div><button id="refresh" type="button">刷新列表</button></div><p id="message" class="status-banner" role="status" aria-live="polite">正在确认管理员身份…</p><section class="panel"><h2>添加设备</h2><p>填写设备名称后，平台将自动生成设备 ID 和接入令牌。</p><form id="create-form" class="form-grid"><label>设备名称<input name="display_name" required maxlength="128"></label><button type="submit">创建设备</button></form></section><section id="credential-panel" class="panel" hidden>
<h2>设备接入配置</h2><p>请将设备 ID 和令牌填入下位机的平台接入配置。令牌仅显示这一次，请及时复制保存；轮换后旧凭据和现有连接立即失效。</p>
<div class="credential-fields">
<div><label for="credential-name">设备名称</label><div class="credential-row"><input id="credential-name" readonly><button id="copy-name" type="button">复制名称</button></div></div>
<div><label for="credential-id">设备 ID</label><div class="credential-row"><input id="credential-id" readonly autocomplete="off"><button id="copy-id" type="button">复制 ID</button></div></div>
<div><label for="credential">设备令牌</label><div class="credential-row"><input id="credential" type="password" readonly autocomplete="off"><button id="copy-token" type="button">复制令牌</button></div></div>
</div><div class="actions"><button id="reveal" type="button">显示 / 隐藏令牌</button><button id="copy-config" type="button">复制接入配置</button><button id="dismiss" type="button">已保存，清除显示</button></div>
</section><section class="panel"><h2>现场设备</h2><div id="devices"></div></section><section id="editor" class="panel" hidden><h2 id="selected-title"></h2><form id="edit-form" class="form-grid"><label>设备名称<input id="display-name" required maxlength="128"></label><label><input id="enabled" type="checkbox">启用设备</label><button type="submit">保存设备</button></form><h3>账号权限</h3><p>模块访问包含该设备开放模块的配置与控制操作；SSH 登录仍需设备系统账号认证。</p><div id="grants"></div><div class="actions"><button id="save-grants" type="button">保存权限</button><button id="rotate" type="button">轮换接入令牌</button><button id="delete" type="button">删除设备</button></div></section></main></div>
<script type="module">
const $=id=>document.getElementById(id);let devices=[],accounts=[],selected=null,busy=false;
function message(text){$('message').textContent=text;}
function clearCredential(){for(const id of ['credential-name','credential-id','credential'])$(id).value='';$('credential').type='password';$('credential-panel').hidden=true;}
function showCredential(device){clearCredential();$('credential-name').value=device.display_name;$('credential-id').value=device.device_id;$('credential').value=device.token;$('credential-panel').hidden=false;}
async function copyText(value){
  if(!value)throw new Error('接入配置已清除，请重新创建或轮换令牌。');
  try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);return;}}catch{/* HTTP 页面或剪贴板授权受限时使用兼容复制。 */}
  const field=document.createElement('textarea'),previous=document.activeElement;
  field.value=value;field.readOnly=true;field.style.position='fixed';field.style.left='-9999px';document.body.append(field);
  try{field.focus();field.select();field.setSelectionRange(0,field.value.length);if(!document.execCommand('copy'))throw new Error('复制失败，请手动选择并复制。');}
  catch{throw new Error('复制失败，请手动选择并复制。');}
  finally{field.value='';field.remove();previous?.focus();}
}
async function api(path,method='GET',value){const response=await fetch(path,{method,credentials:'same-origin',cache:'no-store',headers:method==='GET'?{}:{'Content-Type':'application/json','X-MskDSP-Action':'device'},...(value===undefined?{}:{body:JSON.stringify(value)})});if(response.status===401){clearCredential();location.assign('/login');throw new Error('管理员登录已失效');}if(!response.ok){let error;try{error=await response.json();}catch{}throw new Error(error?.error||'设备操作失败');}return response.status===204?null:response.json();}
async function operation(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();}catch(e){message(e.message||'无法连接平台');}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function render(){const root=$('devices');root.replaceChildren();if(!devices.length){root.textContent='尚无设备，请先添加现场下位机。';return;}for(const device of devices){const button=document.createElement('button');button.type='button';button.textContent=`${device.display_name}（${device.device_id}） · ${!device.enabled?'已禁用':device.online?'在线':'离线'}`;button.style.margin='6px';button.addEventListener('click',()=>operation(()=>select(device)));root.append(button);}}
async function reload(){devices=await api('/api/v1/devices');render();}
async function select(device,keepCredential=false){if(!keepCredential)clearCredential();selected=device;$('selected-title').textContent=`${device.display_name} · ${device.device_id}`;$('display-name').value=device.display_name;$('enabled').checked=device.enabled;$('editor').hidden=false;const current=await api(`/api/v1/devices/${encodeURIComponent(device.device_id)}/grants`),root=$('grants');root.replaceChildren();for(const account of accounts){const grant=current.find(g=>g.account_id===account.id),row=document.createElement('div');row.dataset.account=account.id;row.style.margin='10px 0';const name=document.createElement('span');name.textContent=`${account.display_name}（${account.username}）${account.enabled?'':' · 已停用'}　`;row.append(name);for(const[key,text]of[['allow_grpc','模块访问'],['allow_ssh','SSH']]){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name=key;input.checked=!!grant?.[key];label.append(input,document.createTextNode(text+'　'));row.append(label);}root.append(row);}}
$('create-form').addEventListener('submit',e=>{e.preventDefault();operation(async()=>{clearCredential();const form=new FormData(e.target),created=await api('/api/v1/devices','POST',{display_name:form.get('display_name')});e.target.reset();showCredential(created);await reload();await select({device_id:created.device_id,display_name:created.display_name,enabled:created.enabled},true);message('设备已创建，请复制设备 ID 和令牌，并配置账号权限。');});});
$('edit-form').addEventListener('submit',e=>{e.preventDefault();operation(async()=>{if(!selected)return;if(!$('enabled').checked&&!confirm('禁用会断开设备及全部远程会话，继续？'))return;const updated=await api(`/api/v1/devices/${encodeURIComponent(selected.device_id)}`,'PUT',{display_name:$('display-name').value,enabled:$('enabled').checked});await reload();selected=updated;message('设备设置已保存。');});});
$('save-grants').addEventListener('click',()=>operation(async()=>{if(!selected)return;const grants=[...$('grants').children].map(row=>({account_id:row.dataset.account,allow_grpc:row.querySelector('[name=allow_grpc]').checked,allow_ssh:row.querySelector('[name=allow_ssh]').checked})).filter(g=>g.allow_grpc||g.allow_ssh);await api(`/api/v1/devices/${encodeURIComponent(selected.device_id)}/grants`,'PUT',grants);message('设备权限已保存，撤销的访问将在一秒内终止。');}));
$('rotate').addEventListener('click',()=>operation(async()=>{if(!selected||!confirm('轮换令牌会断开设备及全部远程会话，旧令牌立即失效，继续？'))return;clearCredential();const result=await api(`/api/v1/devices/${encodeURIComponent(selected.device_id)}/token`,'POST');showCredential(result);await reload();message('令牌已轮换，请复制并更新现场设备的接入配置。');}));
$('delete').addEventListener('click',()=>operation(async()=>{if(!selected||!confirm('删除设备会撤销所有权限并断开远程会话，继续？'))return;await api(`/api/v1/devices/${encodeURIComponent(selected.device_id)}`,'DELETE');selected=null;$('editor').hidden=true;clearCredential();await reload();message('设备已删除。');}));
$('refresh').addEventListener('click',()=>operation(async()=>{await reload();message('设备列表已刷新。');}));$('reveal').addEventListener('click',()=>{$('credential').type=$('credential').type==='password'?'text':'password';});$('dismiss').addEventListener('click',clearCredential);window.addEventListener('pagehide',clearCredential);
for(const[button,field,label]of[['copy-name','credential-name','设备名称'],['copy-id','credential-id','设备 ID'],['copy-token','credential','设备令牌']])$(button).addEventListener('click',()=>operation(async()=>{await copyText($(field).value);message(`${label}已复制。`);}));
$('copy-config').addEventListener('click',()=>operation(async()=>{if(!$('credential').value)throw new Error('接入配置已清除，请重新创建或轮换令牌。');await copyText(`设备名称：${$('credential-name').value}\n设备 ID：${$('credential-id').value}\n设备令牌：${$('credential').value}`);message('设备接入配置已复制，请妥善交给配置人员。');}));
$('logout').addEventListener('click',()=>operation(async()=>{clearCredential();const result=await fetch('/api/v1/auth/logout',{method:'POST',credentials:'same-origin',headers:{'X-MskDSP-Action':'auth'}});if(!result.ok)throw new Error('退出暂时失败');location.assign('/login');}));
operation(async()=>{const me=await api('/api/v1/auth/me');if(me.role!=='admin'){location.assign('/login');return;}$('username').textContent=me.username;accounts=await api('/api/v1/accounts');await reload();message('请选择设备管理设置与账号权限。');});
</script></body></html>
