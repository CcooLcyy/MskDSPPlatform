<script id="theme-script">
// 在首屏绘制前恢复主题，所有页面使用同一份偏好。
(() => {
  const key = 'mskdsp-platform-theme';
  const valid = value => ['system', 'light', 'dark'].includes(value);
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  try {
    const saved = window.localStorage.getItem(key);
    if (valid(saved)) preference = saved;
  } catch { /* 存储受限时仍可在当前页面切换主题。 */ }
  function apply() {
    document.documentElement.dataset.theme = preference === 'system' ? (system.matches ? 'dark' : 'light') : preference;
    const select = document.getElementById('theme-select');
    if (select) select.value = preference;
  }
  apply();
  system.addEventListener('change', apply);
  window.addEventListener('storage', event => {
    if (event.key !== key && event.key !== null) return;
    preference = valid(event.newValue) ? event.newValue : 'system';
    apply();
  });
  document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('theme-select');
    apply();
    select.addEventListener('change', () => {
      preference = valid(select.value) ? select.value : 'system';
      try { window.localStorage.setItem(key, preference); }
      catch { /* 保存失败不影响当前页面的显示。 */ }
      apply();
    });
  });
})();
  </script>

  <script type="module">
const $ = id => document.getElementById(id);

async function request(path, options = {}) {

    const body = response.status === 204 ? null : await response.json().catch(() => null);
    if (!response.ok) throw new Error(text(body?.error) || `请求失败（HTTP ${response.status}）`);

  } finally { clearTimeout(timeout); }
}
function size(value) {

  if (value < 1024) return `${value} B`;
  const exponent = Math.min(Math.floor(Math.log(value) / Math.log(1024)), 3);
  return `${(value / 1024 ** exponent).toFixed(1)} ${['B','KiB','MiB','GiB'][exponent]}`;

function field(list, label, value, className) {

}
function timeNode(value) {

  const node = element('time', valid ? date.toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}) : '—');
  if (valid) node.setAttribute('datetime', original);

}
function timeField(list, label, value) {
  const cell = element('dd'); cell.append(timeNode(value)); list.append(element('dt', label), cell);
}
async function mutate(pkg, channel, operation) {

  if (!['publish','withdraw'].includes(operation)) return;
  if (!allowedChannels(pkg).includes(channel) && !(operation === 'withdraw' && channel === 'beta' && pkg.channels.includes(channel))) return;

  const previous = packages.find(item => item.metadata.product === pkg.metadata.product && item.metadata.platform === pkg.metadata.platform && item.channels.includes(channel));
  const transition = `${previous?.metadata.version || '暂无推荐版本'} → ${pkg.metadata.version}`;
  const replaced = packages.filter(item => item.metadata.product === pkg.metadata.product && item.channels.includes(channel) && (pkg.metadata.product === 'mskdsp-upper' ? item.metadata.version !== pkg.metadata.version : item.metadata.platform === pkg.metadata.platform && item.id !== pkg.id));

  const upperNotice = pkg.metadata.product === 'mskdsp-upper' ? '\n上位机按通道切换版本；旧版本的其他架构也会退出推荐，新版本其他架构需逐包发布。' : '';
  const impact = channel === 'stable' ? '\nStable 是稳定通道，使用该通道的客户端将获取此推荐版本。' : '\n发布后该通道的推荐关系将切换。';
  const warning = operation === 'publish' ? `确认将 ${label} 发布到 ${channel.toUpperCase()} 通道？\n${transition}${affected}${upperNotice}${impact}` : `确认从 ${channel.toUpperCase()} 通道撤回 ${label}？\n仅停止该通道推荐，不自动切换其他版本；曾发布文件仍可下载。`;
  if (!window.confirm(warning)) return;
  setBusy(true);
  try {
    await request(`/api/v1/software/packages/${encodeURIComponent(pkg.id)}/${operation}`, {
      method:'POST', headers:{'Content-Type':'application/json', 'X-MskDSP-Action':'software'}, body:JSON.stringify({channel})
    });
    await loadCatalog();
    if (!authenticated) return;
    message(operation === 'publish' ? '版本已发布，通道更新清单已切换。' : '版本已从所选通道撤回。');

}
function allowedChannels(pkg) {

}
function packageChannels(pkg) {
  const channels = element('div', undefined, 'channels');
  if (pkg.metadata.product === 'mskdsp-platform') channels.append(element('span', 'CI 候选包 · 待手动升级', 'badge'));

}
function packageDetails(pkg) {

  field(info, '安装包', meta.file_name); field(info, '大小', size(meta.size));
  timeField(info, '入库时间', pkg.created_at);
  if (meta.build_time) timeField(info, '构建时间', meta.build_time);
  if (meta.package_version) field(info, '包版本', meta.package_version);
  field(info, 'SHA256', meta.sha256, 'digest');
  if (meta.image_id) field(info, '镜像', meta.image_id, 'digest');

}
function packageActions(pkg) {
  const meta = pkg.metadata, actions = element('div', undefined, 'package-actions');

    const update = element('a', '到平台维护页检查和升级'); update.href = '/update';
    actions.append(update); return actions;
  }

  }
  select.value = available.find(name => pkg.channels.includes(name)) || available[0];

    const unavailable = !pkg.channels.includes(select.value);
    withdraw.setAttribute('data-unavailable', String(unavailable));

function renderRecommendations(section, records) {

function renderPlatformSummary() {

// 只有完整来源身份一致才归组。流水线重跑及重复架构均保留独立安装包。

  const buckets = new Map(), keys = new Map();
  for (const pkg of universe) {
    const meta = pkg.metadata;
    if (!text(meta.source_repository).trim() || !text(meta.source_ref).trim() || !/^[0-9a-f]{40}$/i.test(text(meta.source_sha))) continue;
    const ci = meta.version.match(/^(.+)-ci-p([0-9]+)-b[0-9]+-j[0-9]+-[0-9a-f]+$/i);
    const identity = ci ? ['ci',ci[1],ci[2]] : ['version',meta.version];
    const key = JSON.stringify([meta.product,meta.source_repository,meta.source_ref,meta.source_sha,...identity]);
    keys.set(pkg, key);
    if (!buckets.has(key)) buckets.set(key, {label:ci ? `${ci[1]} · CI p${ci[2]}` : meta.version, packages:[]});
    buckets.get(key).packages.push(pkg);
  }
  const result = [], used = new Set();
  for (const pkg of records) {
    const key = keys.get(pkg), bucket = buckets.get(key);
    const visible = bucket?.packages.filter(item => records.includes(item));
    const merge = bucket && visible.length > 1 && new Set(bucket.packages.map(item => item.metadata.platform)).size === bucket.packages.length;
    if (!merge) { result.push({label:pkg.metadata.version, packages:[pkg]}); continue; }
    if (!used.has(key)) { used.add(key); result.push({label:bucket.label, packages:visible}); }
  }
  return result;
}
function packageTable(records) {
  const wrap = element('div', undefined, 'package-table-wrap'), table = element('table', undefined, 'package-table');
  table.setAttribute('aria-label', '安装包历史版本');
  const head = element('thead'), header = element('tr');
  for (const label of ['版本','架构',records[0]?.metadata.product === 'mskdsp-platform' ? '状态' : '发布通道','入库时间','操作']) { const cell = element('th', label); cell.setAttribute('scope','col'); header.append(cell); }
  head.append(header); table.append(head);
  for (const pkg of records) {
    const body = element('tbody'), row = element('tr'), channel = element('td'), actions = element('td'), date = element('td', undefined, 'date-cell');
    channel.append(packageChannels(pkg)); actions.append(packageActions(pkg)); date.append(timeNode(pkg.created_at));
    row.append(element('td', pkg.metadata.version, 'version-cell'), element('td', pkg.metadata.platform, 'architecture-cell'), channel, date, actions);
    const detailRow = element('tr'), detail = element('td', undefined, 'detail-cell'); detail.setAttribute('colspan','5'); detail.append(packageDetails(pkg)); detailRow.append(detail);
    body.append(row, detailRow); table.append(body);
  }
  wrap.append(table); return wrap;
}
function packageCards(records) {
  const grid = element('div', undefined, 'package-grid');
  for (const pkg of records) {
    const card = element('section', undefined, 'panel package-card'), entered = element('p', '入库 · ', 'hint'); entered.append(timeNode(pkg.created_at));
    const actions = packageActions(pkg); actions.className += ' actions';
    card.append(element('h3', pkg.metadata.version), element('p', pkg.metadata.platform, 'identity'), packageChannels(pkg), entered, packageDetails(pkg), actions); grid.append(card);
  }
  return grid;
}
function renderHistory(section) {
  const records = packages.filter(pkg => pkg.metadata.product === section.product), query = section.search.value.trim().toLowerCase();
  const selected = records.filter(pkg => (!query || pkg.metadata.version.toLowerCase().includes(query)) && (!section.architecture.value || pkg.metadata.platform === section.architecture.value) && (!section.channel.value || (section.product === 'mskdsp-platform' ? pkg.metadata.channel === section.channel.value : section.channel.value === 'unpublished' ? pkg.channels.length === 0 : pkg.channels.includes(section.channel.value))));
  section.count.textContent = catalogLoaded ? `${selected.length} 个安装包` : '目录尚未读取成功';
  section.empty.hidden = selected.length !== 0;
  section.empty.textContent = !catalogLoaded ? '目录暂不可用，请刷新后重试。' : records.length ? '没有匹配的软件版本。请调整条件或清除本区块筛选。' : '暂无安装包。上传并校验通过后会显示在这里。';
  if (!section.history.open) return;
  const key = JSON.stringify([records,selected.map(pkg => pkg.id),section.view.value]);
  if (section.listKey === key) return;
  section.listKey = key; section.list.replaceChildren();
  const display = section.view.value === 'cards' ? packageCards : packageTable;
  let singles = [];
  const flush = () => { if (singles.length) { section.list.append(display(singles)); singles = []; } };
  for (const group of groupPackages(selected, records)) {
    if (group.packages.length === 1) { singles.push(group.packages[0]); continue; }
    flush();
    const details = element('details', undefined, 'build-group');
    details.append(element('summary', `${group.label} · ${group.packages.length} 个架构（逐包操作）`), display(group.packages)); section.list.append(details);
  }
  flush(); setBusy(busy);
}
function render() {
  for (const section of sections.values()) {
    const records = packages.filter(pkg => pkg.metadata.product === section.product);
    section.total.textContent = catalogLoaded ? `${records.length} 个安装包` : '目录尚未读取成功';
    section.historyLabel.textContent = `历史版本${catalogLoaded ? ` · ${records.length} 个安装包` : ''}`;
    if (section.product !== 'mskdsp-platform') {
      if (catalogLoaded) renderRecommendations(section, records);
      else section.summary.textContent = '软件目录暂不可用，请刷新后重试。';
    }
    const names = [...new Set(records.map(pkg => pkg.metadata.platform))].sort(), selected = section.architecture.value;
    // 原选项即使不在新目录中也保留，避免刷新悄悄清除用户筛选。
    if (selected && !names.includes(selected)) names.push(selected);
    const key = JSON.stringify(names);
    if (section.architectureKey !== key) {
      section.architectureKey = key; section.architecture.replaceChildren();
      for (const name of ['',...names]) { const option = element('option', name || '全部架构'); option.value = name; section.architecture.append(option); }
      section.architecture.value = selected;
    }
    renderHistory(section);
  }
  renderPlatformSummary(); setBusy(busy);
}
async function loadCatalog() {
  const records = await request('/api/v1/software/packages');
  if (!Array.isArray(records) || !records.every(pkg => pkg && typeof pkg.id === 'string' && pkg.metadata && Object.hasOwn(productNames,pkg.metadata.product) && typeof pkg.metadata.version === 'string' && typeof pkg.metadata.platform === 'string' && typeof pkg.metadata.file_name === 'string' && Array.isArray(pkg.channels) && pkg.channels.every(channel => typeof channel === 'string'))) throw new Error('软件仓库返回了无法识别的版本列表');
  if (!authenticated) return;
  packages = records; catalogLoaded = true; render();
}
async function readPlatformStatus() {
  try {
    const status = await request('/api/update/status');
    const states = ['idle','checking','empty','available','current','updating','succeeded','rolling_back','rolled_back','error'];
    if (!status || typeof status.enabled !== 'boolean' || !states.includes(status.state)) throw new Error('状态格式无法识别');
    if (!authenticated) return;
    platformStatus = status; platformError = '';
  } catch (error) {
    platformStatus = null; platformError = `平台状态暂不可用：${error.message || '请前往平台维护页查看'}`;
    if (authorizationLost) throw error;
  }
  renderPlatformSummary();
}
async function loadAll() {
  const results = await Promise.allSettled([loadCatalog(), readPlatformStatus()]);
  render();
  const failed = results.find(result => result.status === 'rejected');
  if (failed) throw failed.reason;
}
async function refresh() {
  if (busy || !authenticated) return;
  setBusy(true);
  try { await loadAll(); if (authenticated) message(platformError ? '软件目录已刷新，平台状态暂不可用。' : '软件目录与平台状态已刷新。'); }
  catch (error) { message(error.message || '读取软件目录失败', true); }
  finally { setBusy(false); }
}
createSections();
$('refresh').addEventListener('click', refresh);
$('logout').addEventListener('click', async () => {
  if (busy || !authenticated) return;
  setBusy(true);
  try { await request('/api/v1/auth/logout', {method:'POST', headers:{'Content-Type':'application/json','X-MskDSP-Action':'auth'}, body:'{}'}); authenticated = false; authorizationLost = true; location.assign('/login'); }
  catch (error) { message(error.message || '退出失败，请重试', true); }
  finally { setBusy(false); }
});
try {
  const user = await request('/api/v1/auth/me');
  if (user?.role !== 'admin' || !text(user.username).trim()) throw new Error('无法确认管理员身份，请重新登录');
  authenticated = true; $('username').textContent = user.username;
  await loadAll();
  if (authenticated) message('展开各软件历史后可逐包操作；平台软件请前往平台维护页手动升级。');
} catch (error) { message(error.message || '无法读取软件信息', true); }
finally { setBusy(false); }
  </script>
