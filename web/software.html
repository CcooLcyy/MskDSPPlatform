<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
<script id="theme-script">
// 在首屏绘制前恢复主题，所有页面使用同一份偏好。
(() => {
  const key = 'mskdsp-platform-theme';
  const valid = value => ['system', 'light', 'dark'].includes(value);
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  try {
    const saved = window.localStorage.getItem(key);
    if (valid(saved)) preference = saved;
  } catch { /* 存储受限时仍可在当前页面切换主题。 */ }
  function apply() {
    document.documentElement.dataset.theme = preference === 'system' ? (system.matches ? 'dark' : 'light') : preference;
    const select = document.getElementById('theme-select');
    if (select) select.value = preference;
  }
  apply();
  system.addEventListener('change', apply);
  window.addEventListener('storage', event => {
    if (event.key !== key && event.key !== null) return;
    preference = valid(event.newValue) ? event.newValue : 'system';
    apply();
  });
  document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('theme-select');
    apply();
    select.addEventListener('change', () => {
      preference = valid(select.value) ? select.value : 'system';
      try { window.localStorage.setItem(key, preference); }
      catch { /* 保存失败不影响当前页面的显示。 */ }
      apply();
    });
  });
})();
  </script>

<body>

  <script type="module">
const $ = id => document.getElementById(id);
const productNames = {'mskdsp-upper':'上位机', 'mskdsp-lower':'下位机', 'mskdsp-platform':'平台自身'};
let packages = [], busy = true, authenticated = false;
const text = value => typeof value === 'string' ? value : '';
function message(value, failed = false) {
  $('message').textContent = value;
  $('message').classList.toggle('error', failed);
}
function element(tag, value, className) {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = String(value);
  if (className) node.className = className;
  return node;
}
function setBusy(value) {
  busy = value;
  $('refresh').disabled = value || !authenticated;
  $('logout').disabled = value || !authenticated;
  document.querySelectorAll('.package-actions button,.package-actions select').forEach(node => { node.disabled = value || !authenticated || node.getAttribute('data-unavailable') === 'true'; });
}
async function request(path, options = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const response = await fetch(path, {credentials:'same-origin', cache:'no-store', ...options, signal:controller.signal});
    if (response.status === 401) { authenticated = false; location.assign('/login'); throw new Error('登录已失效，请重新登录'); }
    const body = response.status === 204 ? null : await response.json().catch(() => null);
    if (!response.ok) throw new Error(text(body?.error) || `请求失败（HTTP ${response.status}）`);
    return body;
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('请求超时，请刷新后重试');
    throw error;
  } finally { clearTimeout(timeout); }
}
function size(value) {
  if (!Number.isFinite(value) || value < 0) return '—';
  if (value < 1024) return `${value} B`;
  const exponent = Math.min(Math.floor(Math.log(value) / Math.log(1024)), 3);
  return `${(value / 1024 ** exponent).toFixed(1)} ${['B','KiB','MiB','GiB'][exponent]}`;
}
function field(list, label, value, className) {
  list.append(element('dt', label), element('dd', value || '—', className));
}
function timeNode(value) {
  const original = text(value), date = new Date(original), valid = original && Number.isFinite(date.getTime());
  const node = element('time', valid ? date.toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}) : '—');
  if (valid) node.setAttribute('datetime', original);
  node.title = valid ? `${original}（按浏览器本地时区显示）` : '时间不可用';
  return node;
}
function timeField(list, label, value) {
  const cell = element('dd'); cell.append(timeNode(value)); list.append(element('dt', label), cell);
}
async function mutate(pkg, channel, operation) {
  if (busy || !authenticated) return;
  if (pkg.metadata.product === 'mskdsp-platform') { message('平台候选包请到程序更新页手动升级。', true); return; }
  if (!allowedChannels(pkg).includes(channel) || !['publish','withdraw'].includes(operation)) return;
  if (operation === 'withdraw' && !pkg.channels.includes(channel)) { message('该安装包未发布到所选通道。', true); return; }
  const label = `${productNames[pkg.metadata.product] || pkg.metadata.product} ${pkg.metadata.version} · ${pkg.metadata.platform}`;
  const previous = packages.find(item => item.metadata.product === pkg.metadata.product && item.metadata.platform === pkg.metadata.platform && item.channels.includes(channel));
  const transition = `${previous?.metadata.version || '暂无推荐版本'} → ${pkg.metadata.version}`;
  const impact = channel === 'stable' ? '\nStable 是稳定通道，发布后使用该通道的客户端将获取此推荐版本。' : '\n发布后该通道的推荐版本将切换。';
  const warning = operation === 'publish' ? `确认将 ${label} 发布到 ${channel.toUpperCase()} 通道？\n${transition}${impact}` : `确认从 ${channel.toUpperCase()} 通道撤回 ${label}？\n仅停止该通道推荐，不自动切换其他版本；曾发布文件仍可下载。`;
  if (!window.confirm(warning)) return;
  setBusy(true);
  try {
    await request(`/api/v1/software/packages/${encodeURIComponent(pkg.id)}/${operation}`, {
      method:'POST', headers:{'Content-Type':'application/json', 'X-MskDSP-Action':'software'}, body:JSON.stringify({channel})
    });
    await load();
    message(operation === 'publish' ? '版本已发布，通道更新清单已切换。' : '版本已从所选通道撤回。');
  } catch (error) { message(error.message || '软件版本操作失败', true); }
  finally { setBusy(false); }
}
function allowedChannels(pkg) {
  return pkg.metadata.platform === 'linux-x64' && pkg.metadata.product === 'mskdsp-lower' ? ['ci'] : ['ci','beta','stable'];
}
function packageChannels(pkg) {
  const channels = element('div', undefined, 'channels');
  if (pkg.metadata.product === 'mskdsp-platform') channels.append(element('span', 'CI 候选包 · 待手动升级', 'badge'));
  else if (pkg.channels.length === 0) channels.append(element('span', pkg.ever_published ? '已撤回' : '待发布', 'badge'));
  for (const name of pkg.channels) channels.append(element('span', name.toUpperCase(), 'badge'));
  return channels;
}
function packageDetails(pkg) {
  const meta = pkg.metadata, details = element('details', undefined, 'package-details');
  details.append(element('summary', '版本详情与来源'));
  const info = element('dl');
  field(info, '安装包', meta.file_name); field(info, '大小', size(meta.size));
  timeField(info, '入库时间', pkg.created_at);
  if (meta.build_time) timeField(info, '构建时间', meta.build_time);
  if (meta.package_version) field(info, '包版本', meta.package_version);
  field(info, 'SHA256', meta.sha256, 'digest');
  if (meta.image_id) field(info, '镜像', meta.image_id, 'digest');
  if (meta.source_repository) field(info, '代码库', meta.source_repository);
  if (meta.source_ref) field(info, '引用', meta.source_ref);
  if (meta.source_sha) field(info, '提交', meta.source_sha, 'digest');
  details.append(info);
  details.append(element('p', meta.notes || '此版本未提供变更说明。', 'notes'));
  return details;
}
function packageActions(pkg) {
  const meta = pkg.metadata, actions = element('div', undefined, 'package-actions');
  if (meta.product === 'mskdsp-platform') {
    const update = element('a', '到程序更新页检查和升级'); update.href = '/update';
    actions.append(update); return actions;
  }
  const select = element('select');
  select.setAttribute('aria-label', `${meta.version} ${meta.platform} 发布通道`);
  const available = allowedChannels(pkg);
  for (const name of available) {
    const option = element('option', name.toUpperCase()); option.value = name; select.append(option);
  }
  select.value = available.find(name => pkg.channels.includes(name)) || available[0];
  const publish = element('button', '发布', 'primary'), withdraw = element('button', '撤回');
  publish.type = withdraw.type = 'button';
  const updateWithdraw = () => {
    const unavailable = !pkg.channels.includes(select.value);
    withdraw.setAttribute('data-unavailable', String(unavailable));
    withdraw.disabled = busy || !authenticated || unavailable;
    withdraw.title = unavailable ? '此安装包未发布到所选通道' : '停止所选通道推荐此版本';
  };
  select.addEventListener('change', updateWithdraw); updateWithdraw();
  publish.addEventListener('click', () => mutate(pkg, select.value, 'publish'));
  withdraw.addEventListener('click', () => mutate(pkg, select.value, 'withdraw'));
  actions.append(select, publish, withdraw);
  if (pkg.ever_published) {
    const download = element('a', '下载安装包');
    download.href = `/software/packages/${encodeURIComponent(pkg.id)}/${encodeURIComponent(meta.file_name)}`;
    actions.append(download);
  }
  return actions;
}
function render() {
  const product = $('product').value, channel = $('channel').value;
  const architecture = $('architecture').value, query = $('version-search').value.trim().toLowerCase();
  const selected = packages.filter(pkg => {
    const platform = pkg.metadata.product === 'mskdsp-platform';
    return (!product || pkg.metadata.product === product) && (!architecture || pkg.metadata.platform === architecture) && (!query || pkg.metadata.version.toLowerCase().includes(query)) && (!channel || (channel === 'candidate' ? platform : channel === 'unpublished' ? !platform && pkg.channels.length === 0 : pkg.channels.includes(channel) || platform && pkg.metadata.channel === channel));
  });
  $('packages').replaceChildren();
  $('count').textContent = `${selected.length} 个安装包`;
  $('empty').hidden = selected.length !== 0;
  $('empty-title').textContent = packages.length ? '没有匹配的软件版本' : '暂无软件版本';
  $('empty-description').textContent = packages.length ? '调整产品、通道、架构或版本号，或点击“清除筛选”查看全部版本。' : '安装包上传并校验通过后会显示在这里。';
  const cards = $('view').value === 'cards';
  $('packages').className = cards ? 'package-grid' : 'panel package-table-wrap';
  $('packages').hidden = selected.length === 0;
  let table;
  if (!cards && selected.length) {
    table = element('table', undefined, 'package-table');
    table.setAttribute('aria-label', '软件版本列表');
    const head = element('thead'), row = element('tr');
    for (const label of ['产品','版本','架构','发布通道','入库时间','操作']) {
      const cell = element('th', label); cell.setAttribute('scope', 'col'); row.append(cell);
    }
    head.append(row); table.append(head); $('packages').append(table);
  }
  for (const pkg of selected) {
    const meta = pkg.metadata;
    if (cards) {
      const card = element('section', undefined, 'panel package-card');
      const entered = element('p', '入库 · ', 'hint'); entered.append(timeNode(pkg.created_at));
      card.append(element('span', productNames[meta.product] || meta.product, 'badge'), element('h2', meta.version), element('p', meta.platform, 'identity'), packageChannels(pkg), entered, packageDetails(pkg));
      const actions = packageActions(pkg); actions.className += ' actions'; card.append(actions);
      $('packages').append(card);
    } else {
      const body = element('tbody'), row = element('tr');
      const productCell = element('td', productNames[meta.product] || meta.product);
      const channelCell = element('td'), actionsCell = element('td');
      channelCell.append(packageChannels(pkg)); actionsCell.append(packageActions(pkg));
      const dateCell = element('td', undefined, 'date-cell'); dateCell.append(timeNode(pkg.created_at));
      row.append(productCell, element('td', meta.version, 'version-cell'), element('td', meta.platform, 'architecture-cell'), channelCell, dateCell, actionsCell);
      const detailRow = element('tr'), detailCell = element('td', undefined, 'detail-cell');
      detailCell.setAttribute('colspan', '6'); detailCell.append(packageDetails(pkg)); detailRow.append(detailCell);
      body.append(row, detailRow); table.append(body);
    }
  }
  setBusy(busy);
}
async function load() {
  const records = await request('/api/v1/software/packages');
  if (!Array.isArray(records) || !records.every(pkg => pkg && typeof pkg.id === 'string' && pkg.metadata && typeof pkg.metadata.product === 'string' && typeof pkg.metadata.version === 'string' && typeof pkg.metadata.file_name === 'string' && Array.isArray(pkg.channels))) {
    throw new Error('软件仓库返回了无法识别的版本列表');
  }
  packages = records;
  const previousArchitecture = $('architecture').value;
  $('architecture').replaceChildren();
  for (const name of ['', ...new Set(packages.map(pkg => text(pkg.metadata.platform)).filter(Boolean))].sort()) {
    const option = element('option', name || '全部架构'); option.value = name; $('architecture').append(option);
  }
  if ([...new Set(packages.map(pkg => pkg.metadata.platform))].includes(previousArchitecture)) $('architecture').value = previousArchitecture;
  render();
}
async function refresh() {
  if (busy) return;
  setBusy(true);
  try { await load(); message('版本列表已更新。'); }
  catch (error) { message(error.message || '读取版本失败', true); }
  finally { setBusy(false); }
}
$('refresh').addEventListener('click', refresh);
$('product').addEventListener('change', render); $('channel').addEventListener('change', render);
$('architecture').addEventListener('change', render); $('view').addEventListener('change', render);
$('version-search').addEventListener('input', render);
$('clear-filters').addEventListener('click', () => {
  for (const id of ['product','channel','architecture','version-search']) $(id).value = '';
  render();
});
$('logout').addEventListener('click', async () => {
  if (busy) return;
  setBusy(true);
  try { await request('/api/v1/auth/logout', {method:'POST', headers:{'Content-Type':'application/json','X-MskDSP-Action':'auth'}, body:'{}'}); location.assign('/login'); }
  catch (error) { message(error.message || '退出失败，请重试', true); setBusy(false); }
});
try {
  const user = await request('/api/v1/auth/me');
  if (user?.role !== 'admin' || !text(user.username).trim()) throw new Error('无法确认管理员身份，请重新登录');
  authenticated = true; $('username').textContent = user.username;
  await load(); message('平台候选包需手动升级；上下位机安装包可在此发布到更新通道。');
} catch (error) { message(error.message || '无法读取软件版本', true); }
finally { setBusy(false); }
  </script>
