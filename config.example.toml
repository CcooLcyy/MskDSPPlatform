[server]
http_addr = "127.0.0.1:8080"
grpc_addr = "127.0.0.1:50000"
shutdown_timeout_seconds = 10

[runtime]
protocol_version = "platform.v1"
environment = "development"

[software]
# 安装包公开下载地址；发布前必须配置，生产环境使用 HTTPS。
public_base_url = ""
# 高熵发布令牌的 SHA256，留空关闭 PubMgr 写接口，不能填写明文令牌。
publisher_token_sha256 = ""
# CI 专用高熵上传令牌的 SHA256；仅平台 main CI 包上传，不能发布或撤回。
ci_upload_token_sha256 = ""
max_package_bytes = 8589934592
upload_retention_seconds = 86400

[auth]
username = "root"
# 默认使用内置初始密码哈希；自定义密码用 --hash-admin-password 从标准输入生成。
# password_hash = "填入完整的 Argon2id PHC 哈希"
secure_cookie = false
session_seconds = 28800

[tls]
# 本地开发默认关闭 TLS；生产环境应由平台进程或支持 mTLS 的网关终止 TLS。
enabled = false
server_certificate = ""
server_private_key = ""
client_ca_certificate = ""
require_client_certificate = false
