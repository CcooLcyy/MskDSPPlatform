[package]
name = "mskdsp-platform"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "MskDSP 远程服务平台基础服务"
license = "Proprietary"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.10"
semver = "1"
subtle = "2"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "0.8"
tonic = "0.13"
prost = "0.13"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
