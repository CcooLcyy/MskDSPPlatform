[server]
# 管理进程接管公开 HTTP，平台子进程会由环境变量覆盖到内部回环地址。
http_addr = "0.0.0.0:8080"
grpc_addr = "0.0.0.0:50000"
shutdown_timeout_seconds = 10

[runtime]
protocol_version = "platform.v1"
environment = "container"

[software]
# 根据实际外部访问入口配置；留空时不允许发布版本。
public_base_url = ""
# 高熵发布令牌的 SHA256，留空关闭 PubMgr 写接口。
publisher_token_sha256 = ""
# CI 专用高熵上传令牌的 SHA256；仅平台 main CI 包上传，不能发布或撤回。
ci_upload_token_sha256 = ""
max_package_bytes = 8589934592
upload_retention_seconds = 86400

[auth]
username = "root"
# 在 HTTPS 网关后对外部署时改为 true；纯 HTTP 本地调试保持 false。
secure_cookie = false
session_seconds = 28800

[tls]
# 当前服务尚未实现 TLS；需要加密接入时，在外部网关配置 TLS/mTLS。
enabled = false
server_certificate = ""
server_private_key = ""
client_ca_certificate = ""
require_client_certificate = false
